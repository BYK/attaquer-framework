name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package widget pack
        run: tar czf attaquer-framework.tar.gz dist zpack.json

      - uses: actions/upload-artifact@v4
        with:
          name: attaquer-framework
          path: attaquer-framework.tar.gz
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: attaquer-framework.tar.gz
          generate_release_notes: true
