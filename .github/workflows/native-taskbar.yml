name: Native taskbar companion

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "native/**"
      - ".github/workflows/native-taskbar.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-taskbar.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore native/AttaquerTaskbar/AttaquerTaskbar.csproj -r win-x64

      - name: Build
        run: dotnet build native/AttaquerTaskbar/AttaquerTaskbar.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained app
        run: >-
          dotnet publish native/AttaquerTaskbar/AttaquerTaskbar.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o native-publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path native-publish/AttaquerTaskbar.exe)) {
            throw "AttaquerTaskbar.exe was not produced"
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path native-publish/* -DestinationPath attaquer-taskbar-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: attaquer-taskbar-win-x64
          path: native-publish/
          retention-days: 90

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: attaquer-taskbar-win-x64.zip
          generate_release_notes: true
