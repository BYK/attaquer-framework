name: Native taskbar companion

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "native/**"
      - ".github/workflows/native-taskbar.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-taskbar.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create test signing certificate
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=BYK" `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -FriendlyName "Attaquer Taskbar CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = ConvertTo-SecureString "attaquer-ci-package" -AsPlainText -Force
          Export-PfxCertificate `
            -Cert $certificate `
            -FilePath native/AttaquerTaskbar/AttaquerTaskbar_TemporaryKey.pfx `
            -Password $password | Out-Null
          Export-Certificate `
            -Cert $certificate `
            -FilePath native/AttaquerTaskbar/AttaquerTaskbar.cer | Out-Null

      - name: Stamp unique package version
        shell: pwsh
        run: |
          $manifestPath = (Resolve-Path native/AttaquerTaskbar/Package.appxmanifest).Path
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = "0.1.${{ github.run_number }}.0"
          $manifest.Save($manifestPath)
          Write-Host "MSIX version: $($manifest.Package.Identity.Version)"

      - name: Restore
        run: dotnet restore native/AttaquerTaskbar/AttaquerTaskbar.csproj -r win-x64

      - name: Build
        run: dotnet build native/AttaquerTaskbar/AttaquerTaskbar.csproj -c Release -r win-x64 --no-restore

      - name: Publish WPF app
        run: >-
          dotnet publish native/AttaquerTaskbar/AttaquerTaskbar.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:Platform=x64
          -o native-publish

      - name: Build signed MSIX
        shell: pwsh
        run: |
          $layout = Join-Path $PWD "package-layout"
          New-Item -ItemType Directory -Path $layout | Out-Null
          Copy-Item native-publish/* $layout -Recurse -Force
          Copy-Item native/AttaquerTaskbar/Package.appxmanifest `
            (Join-Path $layout "AppxManifest.xml")

          $assets = Join-Path $layout "Assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item native/AttaquerTaskbar/Assets/* $assets -Force

          $sdkBin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Directory |
            Where-Object Name -Match '^10\.' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $sdkBin) { throw "Windows SDK tools were not found" }

          $makeAppx = Join-Path $sdkBin.FullName "x64\makeappx.exe"
          $signTool = Join-Path $sdkBin.FullName "x64\signtool.exe"
          & $makeAppx pack /d $layout /p AttaquerTaskbar.msix /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }

          & $signTool sign `
            /fd SHA256 `
            /f native/AttaquerTaskbar/AttaquerTaskbar_TemporaryKey.pfx `
            /p attaquer-ci-package `
            AttaquerTaskbar.msix
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed with exit code $LASTEXITCODE" }

      - name: Assemble installer
        shell: pwsh
        run: |
          $msix = Get-Item AttaquerTaskbar.msix
          if ($null -eq $msix) { throw "AttaquerTaskbar.msix was not produced" }
          New-Item -ItemType Directory -Path native-package | Out-Null
          Copy-Item $msix.FullName native-package/AttaquerTaskbar.msix
          Copy-Item native/AttaquerTaskbar/AttaquerTaskbar.cer native-package/
          Copy-Item native/install.ps1 native-package/
          Copy-Item native/install.cmd native-package/
          Compress-Archive -Path native-package/* -DestinationPath attaquer-taskbar-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: attaquer-taskbar-win-x64
          path: native-package/
          retention-days: 90

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: attaquer-taskbar-win-x64.zip
          generate_release_notes: true
